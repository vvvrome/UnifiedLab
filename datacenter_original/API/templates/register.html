<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Registro | SCADA</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #0b0f14;

            color: #f8fafc;

            font-family:
                Arial,
                sans-serif;
        }

        .register-card {

            width: 400px;

            padding: 35px;

            background: #111827;

            border:
                1px solid
                rgba(148,163,184,0.2);

            border-radius: 12px;
        }

        h1 {

            margin-top: 0;

            margin-bottom: 8px;
        }

        .subtitle {

            color: #94a3b8;

            margin-bottom: 30px;
        }

        label {

            display: block;

            margin-bottom: 7px;

            font-size: 0.9rem;
        }

        input {

            width: 100%;

            padding: 12px;

            margin-bottom: 18px;

            background: #020617;

            color: white;

            border:
                1px solid
                #334155;

            border-radius: 7px;
        }

        input:focus {

            outline: none;

            border-color: #64748b;
        }

        button {

            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 7px;

            background: #f97316;

            color: white;

            font-weight: bold;

            cursor: pointer;
        }

        .error {

            margin-bottom: 18px;

            padding: 10px;

            border-radius: 6px;

            background:
                rgba(239,68,68,0.15);

            color: #fca5a5;

            font-size: 0.9rem;
        }

        .login {

            margin-top: 20px;

            text-align: center;

            color: #94a3b8;

            font-size: 0.9rem;
        }

        .login a {

            color: #f97316;

            text-decoration: none;
        }

    </style>

</head>

<body>

    <div class="register-card">

        <h1>
            Create account
        </h1>

        <div class="subtitle">

            Nuclear Plant SCADA

        </div>


        {% if error %}

        <div class="error">

            {{ error }}

        </div>

        {% endif %}


        <form method="POST">

            <label>
                Usuario
            </label>

            <input
                type="text"
                name="username"
                minlength="3"
                required
            >


            <label>
                Contraseña
            </label>

            <input
                type="password"
                name="password"
                minlength="8"
                required
            >


            <label>
                Repetir contraseña
            </label>

            <input
                type="password"
                name="password_confirm"
                minlength="8"
                required
            >


            <button type="submit">

                Crear cuenta

            </button>

        </form>


        <div class="login">

            ¿Ya tienes una cuenta?

            <a href="/login">
                Iniciar sesión
            </a>

        </div>

    </div>

</body>

</html>
